doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        types:
            app_email: App\Hub\Shared\Infrastructure\Persistence\Doctrine\Type\EmailType
            app_slug: App\Hub\Shared\Infrastructure\Persistence\Doctrine\Type\SlugType
            app_repository_url: App\Hub\Shared\Infrastructure\Persistence\Doctrine\Type\RepositoryUrlType

    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Hub/Identity/Domain/Model'
                prefix: 'App\Hub\Identity\Domain\Model'
                alias: Identity
            Catalog:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Monitoring/Catalog/Domain/Model'
                prefix: 'App\Monitoring\Catalog\Domain\Model'
                alias: Catalog
            Dependency:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Monitoring/Dependency/Domain/Model'
                prefix: 'App\Monitoring\Dependency\Domain\Model'
                alias: Dependency
            Activity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Monitoring/Activity/Domain/Model'
                prefix: 'App\Monitoring\Activity\Domain\Model'
                alias: Activity
            VersionRegistry:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Monitoring/VersionRegistry/Domain/Model'
                prefix: 'App\Monitoring\VersionRegistry\Domain\Model'
                alias: VersionRegistry
            Sync:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Monitoring/Sync/Domain/Model'
                prefix: 'App\Monitoring\Sync\Domain\Model'
                alias: Sync
            Coverage:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Monitoring/Coverage/Domain/Model'
                prefix: 'App\Monitoring\Coverage\Domain\Model'
                alias: Coverage
