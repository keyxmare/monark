deptrac:
  paths:
    - ./src

  layers:
    - name: Hub_Identity_Domain
      collectors:
        - type: directory
          value: src/Hub/Identity/Domain/.*

    - name: Hub_Identity_Application
      collectors:
        - type: directory
          value: src/Hub/Identity/Application/.*

    - name: Hub_Identity_Infrastructure
      collectors:
        - type: directory
          value: src/Hub/Identity/Infrastructure/.*

    - name: Hub_Identity_Presentation
      collectors:
        - type: directory
          value: src/Hub/Identity/Presentation/.*

    - name: Monitoring_Catalog_Domain
      collectors:
        - type: directory
          value: src/Monitoring/Catalog/Domain/.*

    - name: Monitoring_Catalog_Application
      collectors:
        - type: directory
          value: src/Monitoring/Catalog/Application/.*

    - name: Monitoring_Catalog_Infrastructure
      collectors:
        - type: directory
          value: src/Monitoring/Catalog/Infrastructure/.*

    - name: Monitoring_Catalog_Presentation
      collectors:
        - type: directory
          value: src/Monitoring/Catalog/Presentation/.*

    - name: Monitoring_Dependency_Domain
      collectors:
        - type: directory
          value: src/Monitoring/Dependency/Domain/.*

    - name: Monitoring_Dependency_Application
      collectors:
        - type: directory
          value: src/Monitoring/Dependency/Application/.*

    - name: Monitoring_Dependency_Infrastructure
      collectors:
        - type: directory
          value: src/Monitoring/Dependency/Infrastructure/.*

    - name: Monitoring_Dependency_Presentation
      collectors:
        - type: directory
          value: src/Monitoring/Dependency/Presentation/.*

    - name: Monitoring_Activity_Domain
      collectors:
        - type: directory
          value: src/Monitoring/Activity/Domain/.*

    - name: Monitoring_Activity_Application
      collectors:
        - type: directory
          value: src/Monitoring/Activity/Application/.*

    - name: Monitoring_Activity_Infrastructure
      collectors:
        - type: directory
          value: src/Monitoring/Activity/Infrastructure/.*

    - name: Monitoring_Activity_Presentation
      collectors:
        - type: directory
          value: src/Monitoring/Activity/Presentation/.*

    - name: Monitoring_VersionRegistry_Domain
      collectors:
        - type: directory
          value: src/Monitoring/VersionRegistry/Domain/.*

    - name: Monitoring_VersionRegistry_Application
      collectors:
        - type: directory
          value: src/Monitoring/VersionRegistry/Application/.*

    - name: Monitoring_VersionRegistry_Infrastructure
      collectors:
        - type: directory
          value: src/Monitoring/VersionRegistry/Infrastructure/.*

    - name: Monitoring_VersionRegistry_Presentation
      collectors:
        - type: directory
          value: src/Monitoring/VersionRegistry/Presentation/.*

    - name: Monitoring_Sync_Domain
      collectors:
        - type: directory
          value: src/Monitoring/Sync/Domain/.*

    - name: Monitoring_Sync_Application
      collectors:
        - type: directory
          value: src/Monitoring/Sync/Application/.*

    - name: Monitoring_Sync_Infrastructure
      collectors:
        - type: directory
          value: src/Monitoring/Sync/Infrastructure/.*

    - name: Monitoring_Sync_Presentation
      collectors:
        - type: directory
          value: src/Monitoring/Sync/Presentation/.*

    - name: Hub_Shared
      collectors:
        - type: directory
          value: src/Hub/Shared/.*

  ruleset:
    Hub_Identity_Domain:
      - Hub_Shared
    Hub_Identity_Application:
      - Hub_Identity_Domain
      - Hub_Shared
    Hub_Identity_Infrastructure:
      - Hub_Identity_Domain
      - Hub_Identity_Application
      - Hub_Shared
    Hub_Identity_Presentation:
      - Hub_Identity_Domain
      - Hub_Identity_Application
      - Hub_Shared

    Monitoring_Catalog_Domain:
      - Hub_Shared
    Monitoring_Catalog_Application:
      - Monitoring_Catalog_Domain
      - Monitoring_VersionRegistry_Domain
      - Monitoring_Dependency_Domain
      - Hub_Shared
    Monitoring_Catalog_Infrastructure:
      - Monitoring_Catalog_Domain
      - Monitoring_Catalog_Application
      - Hub_Shared
    Monitoring_Catalog_Presentation:
      - Monitoring_Catalog_Domain
      - Monitoring_Catalog_Application
      - Hub_Identity_Domain
      - Hub_Shared

    Monitoring_Dependency_Domain:
      - Hub_Shared
    Monitoring_Dependency_Application:
      - Monitoring_Dependency_Domain
      - Hub_Shared
    Monitoring_Dependency_Infrastructure:
      - Monitoring_Dependency_Domain
      - Monitoring_Dependency_Application
      - Hub_Shared
    Monitoring_Dependency_Presentation:
      - Monitoring_Dependency_Domain
      - Monitoring_Dependency_Application
      - Hub_Shared

    Monitoring_Activity_Domain:
      - Hub_Shared
    Monitoring_Activity_Application:
      - Monitoring_Activity_Domain
      - Hub_Shared
    Monitoring_Activity_Infrastructure:
      - Monitoring_Activity_Domain
      - Monitoring_Activity_Application
      - Hub_Shared
    Monitoring_Activity_Presentation:
      - Monitoring_Activity_Domain
      - Monitoring_Activity_Application
      - Hub_Shared

    Monitoring_VersionRegistry_Domain:
      - Monitoring_Dependency_Domain
      - Hub_Shared
    Monitoring_VersionRegistry_Application:
      - Monitoring_VersionRegistry_Domain
      - Hub_Shared
    Monitoring_VersionRegistry_Infrastructure:
      - Monitoring_VersionRegistry_Domain
      - Monitoring_VersionRegistry_Application
      - Monitoring_Dependency_Domain
      - Hub_Shared
    Monitoring_VersionRegistry_Presentation:
      - Monitoring_VersionRegistry_Domain
      - Monitoring_VersionRegistry_Application
      - Hub_Shared

    Monitoring_Sync_Domain:
      - Hub_Shared
    Monitoring_Sync_Application:
      - Monitoring_Sync_Domain
      - Monitoring_Catalog_Application
      - Monitoring_Catalog_Domain
      - Monitoring_Dependency_Application
      - Monitoring_Dependency_Domain
      - Monitoring_VersionRegistry_Application
      - Monitoring_VersionRegistry_Domain
      - Hub_Shared
    Monitoring_Sync_Infrastructure:
      - Monitoring_Sync_Domain
      - Hub_Shared
    Monitoring_Sync_Presentation:
      - Monitoring_Sync_Domain
      - Monitoring_Sync_Application
      - Hub_Shared

    Hub_Shared: ~
